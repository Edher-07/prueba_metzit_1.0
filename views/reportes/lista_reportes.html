$def with(datos)
<h1>Reportes</h1>

<a href="/insertar_reporte"><button type="button" class="btn btn-primary mb-3">Agregar Reporte</button></a>

<table class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>ID Usuario</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
    $for item in datos:
        <tr>
            <td>$item['id_reporte']</td>
            <td>$item['id_usuario']</td>
            <td>$item['titulo']</td>
            <td>$item['descripcion']</td>
            <td>$item['estado']</td>
            <td>
                <a href="/ver_reporte/$item['id_reporte']"><button type="button" class="btn btn-info btn-sm">Ver</button></a>
                <a href="/editar_reporte/$item['id_reporte']"><button type="button" class="btn btn-warning btn-sm">Editar</button></a>
                <a href="/borrar_reporte/$item['id_reporte']"><button type="button" class="btn btn-danger btn-sm">Borrar</button></a>
            </td>
        </tr>
    $if not datos:
        <tr><td colspan="6">No hay registros.</td></tr>
    </tbody>
</table>
