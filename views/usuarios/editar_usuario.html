$def with(item)
$if item is None:
    <h1>Ups, no existe este registro</h1>
    <a href="/lista_usuarios"><button type="button" class="btn btn-secondary">Regresar</button></a>
$else:
    <h1>Editar Usuario</h1>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="$item['nombre']">
        </div>

        <div class="mb-3">
            <label class="form-label" for="apellido_paterno">Apellido paterno:</label>
            <input type="text" class="form-control" id="apellido_paterno" name="apellido_paterno" value="$item['apellido_paterno']">
        </div>

        <div class="mb-3">
            <label class="form-label" for="apellido_materno">Apellido materno:</label>
            <input type="text" class="form-control" id="apellido_materno" name="apellido_materno" value="$item['apellido_materno']">
        </div>

        <div class="mb-3">
            <label class="form-label" for="direccion">Dirección:</label>
            <input type="text" class="form-control" id="direccion" name="direccion" value="$item['direccion']">
        </div>

        <div class="mb-3">
            <label class="form-label" for="telefono">Teléfono:</label>
            <input type="tel" class="form-control" id="telefono" name="telefono" value="$item['telefono']">
        </div>

        <div class="mb-3">
            <label class="form-label" for="correo">Correo:</label>
            <input type="email" class="form-control" id="correo" name="correo" value="$item['correo']">
        </div>

        <div class="mb-3">
            <label class="form-label" for="contrasena">Contraseña:</label>
            <input type="password" class="form-control" id="contrasena" name="contrasena" value="$item['contrasena']">
        </div>

        <div class="mb-3">
            <label class="form-label" for="estado">Estado (1 activo / 0 inactivo):</label>
            <input type="text" class="form-control" id="estado" name="estado" value="$item['estado']">
        </div>

        <div class="mb-3">
            <label class="form-label" for="id_rol">ID Rol:</label>
            <input type="number" class="form-control" id="id_rol" name="id_rol" value="$item['id_rol']">
        </div>

        <div class="mb-3">
            <a href="/ver_usuario/$item['id_usuario']"><button type="button" class="btn btn-secondary">Regresar</button></a>
            <button type="submit" name="editar" value="editar" class="btn btn-primary">Guardar cambios</button>
        </div>
    </form>
