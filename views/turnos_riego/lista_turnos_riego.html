$def with(datos)
<h1>Turnos de riego</h1>

<a href="/insertar_turno"><button type="button" class="btn btn-primary mb-3">Agregar Turno de riego</button></a>

<table class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Hora inicio</th>
            <th>Hora fin</th>
            <th>ID Área</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
    $for item in datos:
        <tr>
            <td>$item['id_turno']</td>
            <td>$item['fecha']</td>
            <td>$item['hora_inicio']</td>
            <td>$item['hora_fin']</td>
            <td>$item['id_area']</td>
            <td>$item['estado']</td>
            <td>
                <a href="/ver_turno/$item['id_turno']"><button type="button" class="btn btn-info btn-sm">Ver</button></a>
                <a href="/editar_turno/$item['id_turno']"><button type="button" class="btn btn-warning btn-sm">Editar</button></a>
                <a href="/borrar_turno/$item['id_turno']"><button type="button" class="btn btn-danger btn-sm">Borrar</button></a>
            </td>
        </tr>
    $if not datos:
        <tr><td colspan="7">No hay registros.</td></tr>
    </tbody>
</table>
