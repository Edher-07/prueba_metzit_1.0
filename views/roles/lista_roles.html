$def with(datos)
<h1>Roles</h1>

<a href="/insertar_rol"><button type="button" class="btn btn-primary mb-3">Agregar Rol</button></a>

<table class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre del rol</th>
            <th>Descripción</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
    $for item in datos:
        <tr>
            <td>$item['id_rol']</td>
            <td>$item['nombre_rol']</td>
            <td>$item['descripcion']</td>
            <td>
                <a href="/ver_rol/$item['id_rol']"><button type="button" class="btn btn-info btn-sm">Ver</button></a>
                <a href="/editar_rol/$item['id_rol']"><button type="button" class="btn btn-warning btn-sm">Editar</button></a>
                <a href="/borrar_rol/$item['id_rol']"><button type="button" class="btn btn-danger btn-sm">Borrar</button></a>
            </td>
        </tr>
    $if not datos:
        <tr><td colspan="4">No hay registros.</td></tr>
    </tbody>
</table>
