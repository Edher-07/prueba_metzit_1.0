$def with(item)
$if item is None:
    <h1>Ups, no existe este registro</h1>
    <a href="/lista_area_riego"><button type="button" class="btn btn-secondary">Regresar</button></a>
$else:
    <h1>Editar Área de riego</h1>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre del área:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="$item['nombre']">
        </div>

        <div class="mb-3">
            <label class="form-label" for="suficiente">¿Nivel suficiente? (1/0):</label>
            <input type="text" class="form-control" id="suficiente" name="suficiente" value="$item['suficiente']">
        </div>

        <div class="mb-3">
            <label class="form-label" for="ubicacion">Ubicación:</label>
            <input type="text" class="form-control" id="ubicacion" name="ubicacion" value="$item['ubicacion']">
        </div>

        <div class="mb-3">
            <a href="/ver_area/$item['id_area']"><button type="button" class="btn btn-secondary">Regresar</button></a>
            <button type="submit" name="editar" value="editar" class="btn btn-primary">Guardar cambios</button>
        </div>
    </form>
