$def with(item)
$if item == {}:
    <h1>Ups, no existe este registro</h1>
    <a href="/lista_area_riego"><button type="button" class="btn btn-secondary">Regresar</button></a>
$else:
    <h1>Área de riego</h1>
    <table class="table table-bordered w-auto">
        <tr><th>ID</th><td>$item['id_area']</td></tr>
        <tr><th>Nombre del área</th><td>$item['nombre']</td></tr>
        <tr><th>¿Nivel suficiente? (1/0)</th><td>$item['suficiente']</td></tr>
        <tr><th>Ubicación</th><td>$item['ubicacion']</td></tr>
    </table>
    <a href="/lista_area_riego"><button type="button" class="btn btn-secondary">Regresar</button></a>
    <a href="/editar_area/$item['id_area']"><button type="button" class="btn btn-warning">Editar</button></a>
    <a href="/borrar_area/$item['id_area']"><button type="button" class="btn btn-danger">Borrar</button></a>
